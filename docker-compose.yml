name: room-temp
services:
  app:
    image: room-temp:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      PICO_IP: ${PICO_IP:?Set PICO_IP in .env}
      PICO_TOKEN: ${PICO_TOKEN:?Set PICO_TOKEN in .env}
      DATABASE_PATH: /data/room.db
    ports:
      - "127.0.0.1:${ROOM_PORT:-8765}:8080"
    volumes:
      - room_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  room_data:
